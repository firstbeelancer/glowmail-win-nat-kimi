name: Build GlowMail for Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-action@stable

      - name: Install dependencies
        run: npm ci
        working-directory: ./glowmail-win

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli
        working-directory: ./glowmail-win

      - name: Build frontend
        run: npm run build
        working-directory: ./glowmail-win
        env:
          VITE_BACKEND_PROVIDER: native

      - name: Build Tauri app
        run: tauri build
        working-directory: ./glowmail-win
        env:
          VITE_BACKEND_PROVIDER: native

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: glowmail-windows
          path: |
            glowmail-win/src-tauri/target/release/bundle/msi/*.msi
            glowmail-win/src-tauri/target/release/bundle/nsis/*.exe
